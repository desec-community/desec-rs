# The full check suite, as individually named steps.
#
# The single source of truth for what CI verifies: the push/PR workflow and the release
# workflow both run this, so a tag cannot publish something that would have failed on main.
#
# Deliberately not a single `just ci` call. The recipe is the local entry point, but here
# one step per check is what makes a red run legible at a glance.
#
# Clippy, the tests, the docs and the build itself are flake checks rather than steps here.
# That is what lets them share one compiled dependency tree: the store cache restores it,
# and each derivation then only compiles this crate. Run through `nix develop` they each
# built into a target/ that no cache carried between runs.
name: Run checks
description: Run formatting, packaging and the flake checks in the Nix dev shell.

runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      run: nix develop -c just fmt-check

    - name: Check README.md is up to date
      shell: bash
      run: nix develop -c just readme-check

    - name: Lockfile check
      shell: bash
      run: nix develop -c cargo metadata --locked --format-version 1 > /dev/null

    # Ahead of any publish, so a manifest or include/exclude mistake surfaces while it is
    # still reversible.
    - name: Package check
      shell: bash
      run: nix develop -c cargo package --locked --workspace

    # Clippy, the tests, the docs and the library build itself.
    - name: Nix flake check
      shell: bash
      run: nix flake check --print-build-logs
