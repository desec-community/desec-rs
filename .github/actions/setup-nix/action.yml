# Nix installation and store caching, shared by every workflow.
#
# A composite action rather than a reusable workflow, so a caller can follow it with more
# steps in the same job. That is what lets the release job verify and publish on one
# runner, with the store already warm.
name: Set up Nix
description: Install Nix, restore the store cache, and realise the dev shell.

runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17
      with:
        # Keeps the dev shell's own dependencies in the store, so caching it is worth
        # something: without these the next run rebuilds the shell from scratch.
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
      with:
        # Keyed on the Nix inputs only. Cargo.lock does not affect the dev shell, and
        # including it would evict the cache on every dependency bump.
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    - name: Build Nix dev shell
      shell: bash
      run: nix develop -c true
