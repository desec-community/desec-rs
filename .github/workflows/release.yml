name: Release

on:
  push:
    tags:
      - 'v*'

# A library release ships to crates.io only: there are no binaries to attach, so
# nothing here needs write access to the repository.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Gate the release on the same checks CI runs, so a tag can never publish
      # something that would have failed on main.
      - name: Build, test and lint
        run: nix develop -c just ci

      - name: Check the tag matches the crate version
        run: nix develop -c just check-version "${GITHUB_REF_NAME}"

      # Packaging separately puts any manifest or include/exclude mistake before
      # the publish, which cannot be undone.
      - name: Package the crate
        run: nix develop -c cargo package --locked -p desec

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nix develop -c cargo publish --locked -p desec
