name: Release

on:
  push:
    tags:
      - 'v*'

# A library release ships to crates.io only: there are no binaries to attach, so
# nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # One job, not a dependency on a reusable workflow, so the checks and the publish share
    # a runner and a warm Nix store. The tree that gets published is the one just verified.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: ./.github/actions/setup-nix

      # The same checks main runs, packaging included.
      - uses: ./.github/actions/checks

      - name: Check the tag matches the crate version
        run: nix develop -c just check-version "${GITHUB_REF_NAME}"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nix develop -c cargo publish --locked -p desec
