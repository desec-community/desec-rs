[package]
name = "desec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "deSEC.io DNS API client library"
readme = "../../README.md"
keywords = ["dns", "desec", "dnssec"]
categories = ["network-programming"]

[lints]
workspace = true

[features]
default = ["rustls-tls"]
# TLS via rustls. Disable to supply your own reqwest::Client through
# ClientBuilder::http_client, which is also how to get native-tls or a proxy.
rustls-tls = ["reqwest/rustls"]
# Probe values for characterizing what the API rewrites on storage. Data only, no
# dependencies, #[doc(hidden)], and not covered by semver. Off by default because it is
# research shared with downstream test suites rather than part of the client's interface.
probes = []

[dependencies]
async-stream = "0.3.6"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
futures-core = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "http2",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = [
  "sync",
  "time",
] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
futures-util = { version = "0.3.33", default-features = false, features = [
  "std",
] }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wiremock = "0.6.5"
